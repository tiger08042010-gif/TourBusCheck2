<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Bus Check</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#f3e5f5)
}

.login-box{
  width:90%;
  max-width:420px;
  background:white;
  padding:35px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  text-align:center
}

.bus-icon{font-size:65px}

h1{
  color:#1976d2;
  margin:10px 0 5px
}

.subtitle{
  color:#777;
  margin-bottom:25px
}

input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:16px
}

input:focus{
  outline:none;
  border-color:#1976d2
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#1976d2;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}

button:disabled{
  background:#90caf9
}

#message{
  margin-top:15px;
  color:#d32f2f;
  font-size:14px
}
</style>
</head>

<body>

<div class="login-box">

<div class="bus-icon">🚌</div>

<h1>Tour Bus Check</h1>

<div class="subtitle">
ระบบเช็กชื่อสมาชิกในรถทัวร์
</div>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="อีเมล"
required
>

<input
type="password"
id="password"
placeholder="รหัสผ่าน"
required
>

<button type="submit" id="loginButton">
🔐 เข้าสู่ระบบ
</button>

</form>

<div id="message"></div>

<button
  type="button"
  id="notificationButton"
  style="
    margin-top:15px;
    background:#43a047;
  "
>
  🔔 เปิดการแจ้งเตือน
</button>

</div>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
 getMessaging,
 getToken
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

const firebaseConfig = {

apiKey:"AIzaSyCyc7rXZ254ZPiLR6j-yKbsJSq3o9VahDw",

authDomain:"tourbuscheck2.firebaseapp.com",

projectId:"tourbuscheck2",

storageBucket:"tourbuscheck2.firebasestorage.app",

messagingSenderId:"151352354886",

appId:"1:151352354886:web:6c12aea5b9165149c1c247",

measurementId:"G-LBW7P3XDH1"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
  
const messaging = getMessaging(app);

const VAPID_KEY =
"BGyqN6cOpllsJ68WORoH85YoK-PgjBK3IoWm5fkHlPhouJuMyVQZnI8njTgFexONWf8Bp7aOyao_aQF2Dczwp_s";

const notificationButton =
document.getElementById("notificationButton");

notificationButton.addEventListener("click", async () => {

  try {

    if (!("Notification" in window)) {
      alert("อุปกรณ์นี้ไม่รองรับการแจ้งเตือน");
      return;
    }

    const permission =
      await Notification.requestPermission();

    if (permission !== "granted") {
      alert("ยังไม่ได้อนุญาตการแจ้งเตือน");
      return;
    }

    const registration =
      await navigator.serviceWorker.ready;

    const token = await getToken(
      messaging,
      {
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: registration
      }
    );

    if (token) {

      console.log("FCM TOKEN:");
      console.log(token);

      alert(
        "เปิดการแจ้งเตือนสำเร็จแล้ว 🔔"
      );

    } else {

      alert(
        "ยังไม่สามารถสร้าง Token ได้"
      );

    }

  } catch (error) {

    console.error(
      "Notification error:",
      error
    );

    alert(
      "เกิดข้อผิดพลาดในการเปิดการแจ้งเตือน"
    );

  }

});


const loginForm =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const loginButton =
document.getElementById("loginButton");


loginForm.addEventListener(
"submit",
async function(event){

event.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

message.textContent="";

loginButton.disabled=true;

loginButton.textContent="กำลังเข้าสู่ระบบ...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

window.location.href="dashboard.html";

}catch(error){

console.error(error);

message.textContent=
"อีเมลหรือรหัสผ่านไม่ถูกต้อง";

loginButton.disabled=false;

loginButton.textContent=
"🔐 เข้าสู่ระบบ";

}

});
</script>

<!-- เชื่อม Service Worker สำหรับ PWA -->

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("./sw.js")

.then(() => {

console.log("Service Worker registered");

})

.catch((error) => {

console.error(
"Service Worker error:",
error
);

});

});

}

</script>

</body>
</html>
