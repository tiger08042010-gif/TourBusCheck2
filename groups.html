<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการกลุ่มสมาชิก</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f8ff;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #1976d2;
    }

    .box {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #125aa0;
    }

    .group {
      background: #e8f2ff;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
    }

    .member {
      background: white;
      padding: 10px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .delete {
      background: #e53935;
      margin-top: 8px;
    }

    .back {
      display: block;
      max-width: 700px;
      margin: 20px auto;
      text-align: center;
      text-decoration: none;
      background: #555;
      color: white;
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>👥 จัดการกลุ่มสมาชิก</h1>

  <div class="box">
    <h2>➕ สร้างกลุ่มใหม่</h2>

    <input
      type="text"
      id="groupName"
      placeholder="เช่น คณะท่องเที่ยว A"
    >

    <button onclick="createGroup()">สร้างกลุ่ม</button>
  </div>

  <div class="box">
    <h2>📋 กลุ่มของฉัน</h2>
    <div id="groupsList">กำลังโหลด...</div>
  </div>

  <div class="box">
    <h2>👤 เพิ่มสมาชิกเข้ากลุ่ม</h2>

    <select id="groupSelect">
      <option value="">-- เลือกกลุ่ม --</option>
    </select>

    <select id="busSelect">
      <option value="">-- เลือกรถทัวร์ --</option>
      <option value="1">รถทัวร์คันที่ 1</option>
      <option value="2">รถทัวร์คันที่ 2</option>
      <option value="3">รถทัวร์คันที่ 3</option>
      <option value="4">รถทัวร์คันที่ 4</option>
      <option value="5">รถทัวร์คันที่ 5</option>
    </select>

    <select id="memberSelect">
      <option value="">-- เลือกสมาชิก --</option>
    </select>

    <button onclick="addMemberToGroup()">
      เพิ่มสมาชิกเข้ากลุ่ม
    </button>
  </div>

  <a class="back" href="dashboard.html">
    ← กลับหน้า Dashboard
  </a>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot,
      getDocs,
      updateDoc,
      arrayUnion
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCyc7rXZ254ZPiLR6j-yKbsJSq3o9VahDw",
      authDomain: "tourbuscheck2.firebaseapp.com",
      projectId: "tourbuscheck2",
      storageBucket: "tourbuscheck2.firebasestorage.app",
      messagingSenderId: "151352354886",
      appId: "1:151352354886:web:6c12aea5b9165149c1c247",
      measurementId: "G-LBW7P3XDH1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const groupsRef = collection(db, "groups");

    let groups = [];


    // =========================
    // สร้างกลุ่ม
    // =========================

    window.createGroup = async function() {

      const input = document.getElementById("groupName");
      const name = input.value.trim();

      if (!name) {
        alert("กรุณาใส่ชื่อกลุ่ม");
        return;
      }

      await addDoc(groupsRef, {
        name: name,
        members: []
      });

      input.value = "";

      alert("สร้างกลุ่มเรียบร้อยแล้ว");
    };


    // =========================
    // โหลดกลุ่ม
    // =========================

    onSnapshot(groupsRef, (snapshot) => {

      groups = [];

      const list = document.getElementById("groupsList");
      const select = document.getElementById("groupSelect");

      list.innerHTML = "";
      select.innerHTML =
        '<option value="">-- เลือกกลุ่ม --</option>';

      snapshot.forEach((item) => {

        const data = item.data();

        groups.push({
          id: item.id,
          ...data
        });

        const div = document.createElement("div");

        div.className = "group";

        div.innerHTML = `
          <strong>👥 ${data.name}</strong>
          <div id="members-${item.id}">
  สมาชิกในกลุ่ม: ${data.members?.length || 0} คน

  ${
    data.members && data.members.length > 0
      ? data.members.map(member => `
          <div class="member">
            👤 ${member.name} — รถทัวร์คันที่ ${member.bus}
          </div>
        `).join("")
      : "<div class='member'>ยังไม่มีสมาชิกในกลุ่ม</div>"
  }
</div>
          <button class="delete"
            onclick="deleteGroup('${item.id}')">
            ลบกลุ่ม
          </button>
        `;

        list.appendChild(div);

        const option = document.createElement("option");

        option.value = item.id;
        option.textContent = data.name;

        select.appendChild(option);
      });

    });


    // =========================
    // ลบกลุ่ม
    // =========================

    window.deleteGroup = async function(id) {

      if (!confirm("ต้องการลบกลุ่มนี้หรือไม่?")) {
        return;
      }

      await deleteDoc(doc(db, "groups", id));

    };


    // =========================
    // เลือกรถ → โหลดสมาชิก
    // =========================

    document
      .getElementById("busSelect")
      .addEventListener("change", async function() {

        const busNumber = this.value;

        const memberSelect =
          document.getElementById("memberSelect");

        memberSelect.innerHTML =
          '<option value="">-- เลือกสมาชิก --</option>';

        if (!busNumber) return;

        const membersRef =
          collection(
            db,
            "buses",
            `bus${busNumber}`,
            "members"
          );

        const snapshot = await getDocs(membersRef);

        snapshot.forEach((item) => {

          const data = item.data();

          const option =
            document.createElement("option");

          option.value = item.id;

          option.textContent =
            data.name || "ไม่มีชื่อ";

          memberSelect.appendChild(option);

        });

      });


    // =========================
    // เพิ่มสมาชิกเข้ากลุ่ม
    // =========================

    window.addMemberToGroup = async function() {

      const groupId =
        document.getElementById("groupSelect").value;

      const busNumber =
        document.getElementById("busSelect").value;

      const memberId =
        document.getElementById("memberSelect").value;

      if (!groupId || !busNumber || !memberId) {

        alert("กรุณาเลือกกลุ่ม รถ และสมาชิกให้ครบ");

        return;
      }

      const memberRef =
        doc(
          db,
          "buses",
          `bus${busNumber}`,
          "members",
          memberId
        );

      const memberSnapshot =
        await getDocs(
          collection(
            db,
            "buses",
            `bus${busNumber}`,
            "members"
          )
        );

      let memberData = null;

      memberSnapshot.forEach((item) => {

        if (item.id === memberId) {
          memberData = item.data();
        }

      });

      if (!memberData) {
        alert("ไม่พบข้อมูลสมาชิก");
        return;
      }

      const groupRef =
        doc(db, "groups", groupId);

      await updateDoc(groupRef, {

        members: arrayUnion({

          id: memberId,

          name: memberData.name || "ไม่มีชื่อ",

          bus: busNumber

        })

      });

      alert("เพิ่มสมาชิกเข้ากลุ่มแล้ว");

    };

  // =========================
// ระบบส่งข้อความแจ้งข่าวสาร
// =========================

const announcementGroup =
  document.getElementById("announcementGroup");

const announcementMessage =
  document.getElementById("announcementMessage");

const announcementList =
  document.getElementById("announcementList");

// โหลดรายชื่อกลุ่มมาใส่ในช่องเลือก
onSnapshot(groupsRef, (snapshot) => {

  announcementGroup.innerHTML =
    '<option value="">-- เลือกกลุ่ม --</option>';

  snapshot.forEach((item) => {

    const data = item.data();

    const option =
      document.createElement("option");

    option.value = item.id;
    option.textContent = data.name;

    announcementGroup.appendChild(option);

  });

});


// ส่งประกาศ
window.sendAnnouncement = async function() {

  const groupId =
    announcementGroup.value;

  const message =
    announcementMessage.value.trim();

  if (!groupId) {
    alert("กรุณาเลือกกลุ่ม");
    return;
  }

  if (!message) {
    alert("กรุณาพิมพ์ข้อความ");
    return;
  }

  const announcementsRef =
    collection(
      db,
      "groups",
      groupId,
      "announcements"
    );

  await addDoc(announcementsRef, {

    message: message,

    createdAt: new Date()

  });

  announcementMessage.value = "";

  alert("ส่งประกาศเรียบร้อยแล้ว");

};</script>
<div class="box">
  <h2>📢 ส่งข้อความแจ้งข่าวสาร</h2>

  <select id="announcementGroup">
    <option value="">-- เลือกกลุ่ม --</option>
  </select>

  <textarea
    id="announcementMessage"
    placeholder="พิมพ์ข้อความแจ้งข่าวสาร เช่น รถทัวร์จะออกเวลา 18:00 น."
    style="
      width:100%;
      box-sizing:border-box;
      min-height:120px;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
      resize:vertical;
    "
  ></textarea>

  <button onclick="sendAnnouncement()">
    📢 ส่งประกาศ
  </button>

  <div id="announcementList" style="margin-top:20px;">
    ยังไม่มีประกาศ
  </div>
</div>
</body>
</html>
