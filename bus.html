<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Bus Check</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
      color: #333;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .bus-icon {
      font-size: 55px;
    }

    h1 {
      margin: 10px 0 5px;
      color: #1976d2;
    }

    .subtitle {
      color: #777;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }

    .summary-number {
      font-size: 32px;
      font-weight: bold;
      color: #1976d2;
    }

    .summary-title {
      margin-top: 5px;
      color: #666;
    }

    .add-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .add-box h2 {
      margin-top: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #1976d2;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .add-button {
      background: #1976d2;
      color: white;
      font-weight: bold;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member-card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.08);
    }

    .member-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .member-name {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
    }

    .boarded {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .not-boarded {
      background: #fff3e0;
      color: #ef6c00;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .check-button {
      background: #43a047;
      color: white;
    }

    .edit-button {
      background: #ffb300;
      color: white;
    }

    .delete-button {
      background: #e53935;
      color: white;
    }

    .back-button {
      width: 100%;
      margin-top: 20px;
      background: #555;
      color: white;
      padding: 15px;
    }

    .empty {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: #777;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 650px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .input-row {
        flex-direction: column;
      }

      .member-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .button-row button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ส่วนหัว -->
    <div class="header">
      <div class="bus-icon">🚌</div>

      <h1 id="busTitle">
        กำลังโหลด...
      </h1>

      <div class="subtitle">
        ระบบเช็กชื่อสมาชิกในรถทัวร์
      </div>
    </div>


    <!-- สรุปจำนวนสมาชิก -->
    <div class="summary">

      <div class="summary-card">
        <div class="summary-number" id="total">
          0
        </div>

        <div class="summary-title">
          สมาชิกทั้งหมด
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-number" id="boarded">
          0
        </div>

        <div class="summary-title">
          ขึ้นรถแล้ว
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-number" id="notBoarded">
          0
        </div>

        <div class="summary-title">
          ยังไม่ขึ้นรถ
        </div>
      </div>

    </div>


    <!-- เพิ่มสมาชิก -->
    <div class="add-box">

      <h2>
        ➕ เพิ่มสมาชิก
      </h2>

      <div class="input-row">

        <input
          type="text"
          id="memberName"
          placeholder="กรอกชื่อนักท่องเที่ยว"
        >

        <button
          class="add-button"
          onclick="addMember()"
        >
          เพิ่มสมาชิก
        </button>

      </div>

    </div>


    <!-- รายชื่อสมาชิก -->
    <div id="memberList">

      <div class="loading">
        กำลังโหลดรายชื่อ...
      </div>

    </div>


    <!-- กลับหน้า Dashboard -->
    <button
      class="back-button"
      onclick="goBack()"
    >
      ← กลับหน้ารถทัวร์
    </button>

  </div>


  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      updateDoc,
      onSnapshot
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    import {
      getAuth
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    // Firebase Configuration
    const firebaseConfig = {

      apiKey:
        "AIzaSyCyc7rXZ254ZPiLR6j-yKbsJSq3o9VahDw",

      authDomain:
        "tourbuscheck2.firebaseapp.com",

      projectId:
        "tourbuscheck2",

      storageBucket:
        "tourbuscheck2.firebasestorage.app",

      messagingSenderId:
        "151352354886",

      appId:
        "1:151352354886:web:6c12aea5b9165149c1c247",

      measurementId:
        "G-LBW7P3XDH1"

    };


    // เริ่ม Firebase
    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);


    // =====================================================
    // ตรวจสอบหมายเลขรถจาก URL
    // =====================================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    const busNumber =
      params.get("bus");


    // ต้องเป็นรถ 1-5 เท่านั้น
    if (
      !["1", "2", "3", "4", "5"]
      .includes(busNumber)
    ) {

      alert(
        "ไม่พบหมายเลขรถทัวร์"
      );

      window.location.href =
        "dashboard.html";

      throw new Error(
        "Invalid bus number"
      );
    }


    // แสดงชื่อรถ
    document.getElementById(
      "busTitle"
    ).textContent =
      "รถทัวร์คันที่ " +
      busNumber;


    // =====================================================
    // Firestore
    // =====================================================

    const membersRef =
      collection(
        db,
        "buses",
        "bus" + busNumber,
        "members"
      );


    let members = [];


    // =====================================================
    // โหลดสมาชิกแบบ Real-time
    // =====================================================

    onSnapshot(

      membersRef,

      (snapshot) => {

        members =
          snapshot.docs.map(
            (item) => ({

              id: item.id,

              ...item.data()

            })
          );


        displayMembers();

      },

      (error) => {

        console.error(
          "Firestore Error:",
          error
        );


        alert(
          "ไม่สามารถเชื่อมต่อฐานข้อมูลได้\n\n" +
          "รหัส: " +
          error.code +
          "\n" +
          "รายละเอียด: " +
          error.message
        );

      }

    );


    // =====================================================
    // เพิ่มสมาชิก
    // =====================================================

    window.addMember =
      async function () {

        // ตรวจสอบการ Login
        const user =
          auth.currentUser;


        if (!user) {

          alert(
            "ยังไม่ได้เข้าสู่ระบบ\n\n" +
            "กรุณากลับไปหน้า Login ก่อน"
          );

          return;

        }


        const input =
          document.getElementById(
            "memberName"
          );


        const name =
          input.value.trim();


        if (name === "") {

          alert(
            "กรุณากรอกชื่อสมาชิก"
          );

          return;

        }


        try {

          await addDoc(

            membersRef,

            {

              name: name,

              boarded: false

            }

          );


          input.value = "";


          alert(
            "เพิ่มสมาชิกสำเร็จ ✅"
          );


        }

        catch (error) {

          console.error(
            "Add member error:",
            error
          );


          alert(

            "ไม่สามารถเพิ่มสมาชิกได้\n\n" +

            "รหัส: " +
            error.code +

            "\n\n" +

            "รายละเอียด: " +
            error.message

          );

        }

      };


    // =====================================================
    // เปลี่ยนสถานะขึ้นรถ
    // =====================================================

    window.toggleBoarding =
      async function (
        id,
        currentStatus
      ) {

        try {

          await updateDoc(

            doc(
              membersRef,
              id
            ),

            {

              boarded:
                !currentStatus

            }

          );

        }

        catch (error) {

          console.error(
            error
          );

          alert(

            "ไม่สามารถเปลี่ยนสถานะได้\n\n" +

            error.message

          );

        }

      };


    // =====================================================
    // แก้ไขชื่อ
    // =====================================================

    window.editMember =
      async function (
        id,
        oldName
      ) {

        const newName =
          prompt(
            "แก้ไขชื่อสมาชิก",
            oldName
          );


        if (
          newName === null
        ) {

          return;

        }


        const name =
          newName.trim();


        if (name === "") {

          alert(
            "กรุณากรอกชื่อสมาชิก"
          );

          return;

        }


        try {

          await updateDoc(

            doc(
              membersRef,
              id
            ),

            {

              name: name

            }

          );

        }

        catch (error) {

          console.error(
            error
          );

          alert(

            "ไม่สามารถแก้ไขชื่อได้\n\n" +

            error.message

          );

        }

      };


    // =====================================================
    // ลบสมาชิก
    // =====================================================

    window.deleteMember =
      async function (id) {

        if (
          !confirm(
            "ต้องการลบสมาชิกคนนี้หรือไม่?"
          )
        ) {

          return;

        }


        try {

          await deleteDoc(

            doc(
              membersRef,
              id
            )

          );

        }

        catch (error) {

          console.error(
            error
          );

          alert(

            "ไม่สามารถลบสมาชิกได้\n\n" +

            error.message

          );

        }

      };


    // =====================================================
    // แสดงรายชื่อ
    // =====================================================

    function displayMembers() {

      const list =
        document.getElementById(
          "memberList"
        );


      list.innerHTML = "";


      if (
        members.length === 0
      ) {

        list.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              👥
            </div>

            <p>
              ยังไม่มีรายชื่อสมาชิก
            </p>

          </div>

        `;


        updateSummary();

        return;

      }


      members.forEach(
        (member) => {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "member-card";


          const top =
            document.createElement(
              "div"
            );


          top.className =
            "member-top";


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "member-name";


          name.textContent =
            member.name;


          const status =
            document.createElement(
              "div"
            );


          status.className =
            "status " +

            (
              member.boarded
                ? "boarded"
                : "not-boarded"
            );


          status.textContent =

            member.boarded

              ? "✅ ขึ้นรถแล้ว"

              : "⏳ ยังไม่ขึ้นรถ";


          top.appendChild(
            name
          );

          top.appendChild(
            status
          );


          const buttons =
            document.createElement(
              "div"
            );


          buttons.className =
            "button-row";


          // ปุ่มเช็กขึ้นรถ
          const checkButton =
            document.createElement(
              "button"
            );


          checkButton.className =
            "check-button";


          checkButton.textContent =

            member.boarded

              ? "↩️ เปลี่ยนสถานะ"

              : "✅ เช็กขึ้นรถ";


          checkButton.onclick =
            () =>
              toggleBoarding(
                member.id,
                member.boarded
              );


          // ปุ่มแก้ไข
          const editButton =
            document.createElement(
              "button"
            );


          editButton.className =
            "edit-button";


          editButton.textContent =
            "✏️ แก้ไข";


          editButton.onclick =
            () =>
              editMember(
                member.id,
                member.name
              );


          // ปุ่มลบ
          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.className =
            "delete-button";


          deleteButton.textContent =
            "🗑️ ลบ";


          deleteButton.onclick =
            () =>
              deleteMember(
                member.id
              );


          buttons.appendChild(
            checkButton
          );


          buttons.appendChild(
            editButton
          );


          buttons.appendChild(
            deleteButton
          );


          div.appendChild(
            top
          );


          div.appendChild(
            buttons
          );


          list.appendChild(
            div
          );

        }
      );


      updateSummary();

    }


    // =====================================================
    // สรุปจำนวน
    // =====================================================

    function updateSummary() {

      const total =
        members.length;


      const boarded =
        members.filter(
          (member) =>
            member.boarded === true
        ).length;


      const notBoarded =
        total - boarded;


      document.getElementById(
        "total"
      ).textContent =
        total;


      document.getElementById(
        "boarded"
      ).textContent =
        boarded;


      document.getElementById(
        "notBoarded"
      ).textContent =
        notBoarded;

    }


    // =====================================================
    // กลับหน้า Dashboard
    // =====================================================

    window.goBack =
      function () {

        window.location.href =
          "dashboard.html";

      };

  </script>

</body>
</html>
