<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tour Bus Check</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #eff6ff
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px 25px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);
        }

        .logo {
            font-size: 65px;

            margin-bottom: 10px;
        }

        h1 {
            color: #1e3a8a;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;

            font-size: 16px;

            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;

            margin-bottom: 15px;
        }

        .input-group label {
            display: block;

            color: #334155;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 12px;

            font-size: 16px;

            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .footer {
            margin-top: 22px;

            color: #94a3b8;

            font-size: 13px;
        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">
            🚌
        </div>


        <h1>
            Tour Bus Check
        </h1>


        <p class="subtitle">
            ระบบเช็กชื่อสมาชิกในรถทัวร์
        </p>


        <form action="dashboard.html">


            <div class="input-group">

                <label>
                    📧 อีเมล
                </label>

                <input
                    type="email"
                    placeholder="กรอกอีเมล"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    🔒 รหัสผ่าน
                </label>

                <input
                    type="password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                เข้าสู่ระบบ
            </button>


        </form>


        <div class="footer">

            Tour Bus Check
            <br>
            ระบบจัดการสมาชิกในรถทัวร์

        </div>


    </div>


</body>

</html>
